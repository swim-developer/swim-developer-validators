<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Arial, sans-serif">

  <text x="380" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#212121">swim-developer-validators � Test Harness Overview</text>

  <!-- Consumer validators -->
  <rect x="20" y="50" width="340" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="190" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Consumer Validators</text>
  <text x="100" y="95" text-anchor="middle" font-size="10" fill="#37474f">swim-dnotam-consumer-validator</text>
  <text x="100" y="110" text-anchor="middle" font-size="10" fill="#78909c">MockServer � Artemis � event generator</text>
  <text x="280" y="95" text-anchor="middle" font-size="10" fill="#37474f">swim-ed254-consumer-validator</text>
  <text x="280" y="110" text-anchor="middle" font-size="10" fill="#78909c">MockServer � Artemis � event generator</text>

  <!-- Provider validators -->
  <rect x="400" y="50" width="340" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
  <text x="570" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#0d47a1">Provider Validators</text>
  <text x="490" y="95" text-anchor="middle" font-size="10" fill="#37474f">swim-dnotam-provider-validator</text>
  <text x="490" y="110" text-anchor="middle" font-size="10" fill="#78909c">MockClient � subscribes and verifies</text>
  <text x="670" y="95" text-anchor="middle" font-size="10" fill="#37474f">swim-ed254-provider-validator</text>
  <text x="670" y="110" text-anchor="middle" font-size="10" fill="#78909c">MockClient � subscribes and verifies</text>

  <!-- Arrows -->
  <line x1="190" y1="130" x2="190" y2="165" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="130" x2="570" y2="165" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SUT boxes -->
  <rect x="80" y="165" width="220" height="40" rx="6" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="190" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a148c">SUT: swim-*-consumer</text>
  <text x="190" y="196" text-anchor="middle" font-size="10" fill="#546e7a">connects to validator stack</text>

  <rect x="460" y="165" width="220" height="40" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
  <text x="570" y="181" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">SUT: swim-*-provider</text>
  <text x="570" y="196" text-anchor="middle" font-size="10" fill="#546e7a">validator subscribes to it</text>

  <text x="380" y="235" text-anchor="middle" font-size="10" fill="#78909c">Each validator runs locally via compose.yml � no real EUROCONTROL infrastructure needed</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#757575"/>
    </marker>
  </defs>

</svg>
